<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e59a26">
<title>Cervecería</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand"><h1 id="brand">Cervecería</h1><div class="row" id="who"></div></div>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="loading">Cargando…</div></main>
<div id="toast" role="status" aria-live="polite"></div>

<div id="ready" class="ov" hidden role="alertdialog" aria-labelledby="rd-t"><div>
  <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fff"/><path class="ck" d="M30 52 L44 66 L71 37" fill="none" stroke="#1f7a3a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="code" id="rd-c"></div><h2 id="rd-t">¡Tu pedido está listo!</h2><p id="rd-p"></p><button data-a="rdok">¡Voy!</button></div></div>

<div id="modal" class="ov" hidden role="dialog" aria-labelledby="md-t"><div class="card">
  <div class="mute" id="md-t">Pedido cargado</div><div class="code" id="md-c"></div><p id="md-p" style="margin:0 0 18px"></p>
  <button class="pri" style="width:100%" data-a="mdok">Listo</button></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
